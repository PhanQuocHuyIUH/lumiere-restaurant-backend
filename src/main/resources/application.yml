spring:
  docker:
    compose:
      enabled: false
  application:
    name: lumiere-restaurant-backend
  config:
    import: optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: ${SPRING_MULTIPART_MAX_FILE_SIZE}
      max-request-size: ${SPRING_MULTIPART_MAX_REQUEST_SIZE}
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
    # --- Option 1: Local (Docker) HikariCP ---
    # hikari:
    #   maximum-pool-size: 20
    #   minimum-idle: 5
    # --- Option 2: Supabase HikariCP ---
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    # --- Option 1: Local (Docker) Flyway ---
    # (Bỏ url/user/password, nó sẽ tự dùng của datasource)
    # --- Option 2: Supabase Flyway ---
    url: ${DB_MIGRATION_URL}
    user: ${DB_USER}
    password: ${DB_PASS}
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 86400000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      timeout: 2000
      jedis:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8080
logging:
  level:
    iuh.fit.se: DEBUG

app:
  qr:
    base-url: ${QR_BASE_URL}
    session-expiration: ${QR_SESSION_EXPIRATION}
  payment:
    vnpay:
      endpoint: ${VNPAY_ENDPOINT}
      refund-endpoint: ${VNPAY_REFUND_ENDPOINT}
      tmn-code: ${VNPAY_TMN_CODE}
      hash-secret: ${VNPAY_HASH_SECRET}
      return-url: ${VNPAY_RETURN_URL}
      ipn-url: ${VNPAY_IPN_URL}
      command: ${VNPAY_COMMAND}
      version: ${VNPAY_VERSION}
  storage:
    cloudinary:
      cloud-name: ${CLOUDINARY_CLOUD_NAME}
      api-key: ${CLOUDINARY_API_KEY}
      api-secret: ${CLOUDINARY_API_SECRET}
      menu-folder: ${CLOUDINARY_MENU_FOLDER}
      table-qr-folder: ${CLOUDINARY_TABLE_QR_FOLDER}
      max-file-size-bytes: ${CLOUDINARY_MAX_FILE_SIZE_BYTES}

ai:
  enabled: ${AI_ENABLED:true}
  runtime-enabled: ${AI_RUNTIME_ENABLED:true}
  base-url: ${AI_BASE_URL:http://localhost:8001}
  service-key: ${AI_SERVICE_KEY:}
  timeout-ms:
    # Timeout (ms) cho từng AI operation. Gemini API thường response 3-8s → chatbot cần buffer cao.
    sync-menu: ${AI_TIMEOUT_SYNC_MENU_MS:5000}
    recommend: ${AI_TIMEOUT_RECOMMEND_MS:5000}
    chatbot: ${AI_TIMEOUT_CHATBOT_MS:25000}
    forecast: ${AI_TIMEOUT_FORECAST_MS:10000}
    combo-generate: ${AI_TIMEOUT_COMBO_GENERATE_MS:15000}
    batching: ${AI_TIMEOUT_BATCHING_MS:5000}
    feedback: ${AI_TIMEOUT_FEEDBACK_MS:3000}
    retrain: ${AI_TIMEOUT_RETRAIN_MS:5000}
    job-status: ${AI_TIMEOUT_JOB_STATUS_MS:3000}
  health-check:
    enabled: ${AI_HEALTH_CHECK_ENABLED:true}
    initial-delay-ms: ${AI_HEALTH_CHECK_INITIAL_DELAY_MS:10000}
    fixed-delay-ms: ${AI_HEALTH_CHECK_FIXED_DELAY_MS:30000}
  feedback:
    flush-interval-ms: ${AI_FEEDBACK_FLUSH_INTERVAL_MS:300000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
