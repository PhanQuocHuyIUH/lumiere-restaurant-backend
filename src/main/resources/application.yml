spring:
  application:
    name: lumiere-restaurant-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/lumiere
    username: ${DB_USER:postgres}
    password: ${DB_PASS:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 3
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-min-256-bits}
      expiration: 86400000
server:
  port: 8080
logging:
  level:
    iuh.fit.se: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
