spring:
  application:
    name: lumiere-restaurant-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/lumiere
    username: ${DB_USER:postgres}
    password: ${DB_PASS:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # baseline-version: 3
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-in-production-min-256-bits}
      expiration: 86400000
server:
  port: 8080
logging:
  level:
    iuh.fit.se: DEBUG

app:
  qr:
    base-url: ${QR_BASE_URL:http://localhost:8080/menu/tables/qr}
    session-expiration: ${QR_SESSION_EXPIRATION:1800000}
  payment:
    vnpay:
      endpoint: ${VNPAY_ENDPOINT:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      refund-endpoint: ${VNPAY_REFUND_ENDPOINT:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment-return}
      ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/payments/webhooks/vnpay}
      command: ${VNPAY_COMMAND:pay}
      version: ${VNPAY_VERSION:2.1.0}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
